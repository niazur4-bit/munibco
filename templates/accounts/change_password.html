{% extends "base.html" %}
{% block title %}Change Password — Munib and Co{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="form-card">
    <h2>Change Password</h2>
    <form method="post">
      {% csrf_token %}
      {% for field in form %}
      <div class="field">
        <label>{{ field.label }}</label>
        {{ field }}
        {{ field.errors }}
      </div>
      {% endfor %}
      <button type="submit" class="btn btn-gold btn-block">Update Password</button>
    </form>
  </div>
</div>
{% endblock %}
