{% extends "base.html" %}
{% block title %}My Profile — Munib and Co{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="form-card">
    <h2>My Profile</h2>
    <form method="post">
      {% csrf_token %}
      {% for field in form %}
      <div class="field">
        <label>{{ field.label }}</label>
        {{ field }}
        {{ field.errors }}
      </div>
      {% endfor %}
      <button type="submit" class="btn btn-gold btn-block">Save Changes</button>
    </form>
    <div class="form-foot"><a href="{% url 'accounts:change_password' %}">Change password</a></div>
  </div>
</div>
{% endblock %}
