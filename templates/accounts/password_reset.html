{% extends "base.html" %}
{% block title %}Reset Password — Munib and Co{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="form-card">
    <h2>Reset your password</h2>
    <p class="sub">Enter your email and we'll send you a link to reset it.</p>
    <form method="post">
      {% csrf_token %}
      {{ form.email.errors }}
      <div class="field">
        <label>Email</label>
        {{ form.email }}
      </div>
      <button type="submit" class="btn btn-gold btn-block">Send Reset Link</button>
    </form>
    <div class="form-foot"><a href="{% url 'accounts:login' %}">Back to login</a></div>
  </div>
</div>
{% endblock %}
