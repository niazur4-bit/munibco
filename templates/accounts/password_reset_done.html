{% extends "base.html" %}
{% block title %}Check Your Email — Munib and Co{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="form-card" style="text-align:center;">
    <i class="fa-solid fa-envelope-circle-check" style="font-size:2.2rem;color:var(--gold);"></i>
    <h2>Check your email</h2>
    <p class="sub">If an account exists with that email, we've sent a link to reset your password. It may take a few minutes to arrive.</p>
    <a href="{% url 'accounts:login' %}" class="btn btn-navy btn-block">Back to login</a>
  </div>
</div>
{% endblock %}
